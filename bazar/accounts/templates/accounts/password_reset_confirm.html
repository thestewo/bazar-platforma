{% extends 'base.html' %}

{% block content %}
<div class="container mt-5" style="max-width: 450px;">
    <div class="card shadow-sm p-4">
        <h3 class="text-center mb-3">Zmeňte svoje heslo</h3>
        {% if validlink %}
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 mt-2">Uložiť nové heslo</button>
            </form>
        {% else %}
            <div class="alert alert-danger text-center">
                Odkaz je neplatný alebo vypršal!
            </div>
            <a href="{% url 'login' %}" class="btn btn-secondary w-100">Späť na prihlásenie</a>
        {% endif %}
    </div>
</div>
{% endblock %}
